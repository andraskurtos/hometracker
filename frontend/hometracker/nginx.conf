server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Receipt photos can be large.
    client_max_body_size 25m;

    # REST API. Same-origin, so the frontend bundle needs no host or port.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded avatars, served by the API's static mount.
    location /uploads/ {
        proxy_pass http://api:8000/uploads/;
        proxy_set_header Host $host;
    }

    # SPA fallback: let react-router own every non-file route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

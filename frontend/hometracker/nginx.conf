server {
    listen 80;
    server_name _;

    # --- HTTPS / SSL Configuration (Optional) ---
    # To enable push notifications in production/LAN, browsers require HTTPS.
    # 1. Generate certs: mkcert -cert-file cert.pem -key-file key.pem <your-server-ip>
    # 2. Uncomment the three lines below, and the SSL lines in docker-compose.yml
    #
    # listen 443 ssl;
    # ssl_certificate /etc/nginx/ssl/cert.pem;
    # ssl_certificate_key /etc/nginx/ssl/key.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Receipt photos can be large.
    client_max_body_size 25m;

    # REST API. Same-origin, so the frontend bundle needs no host or port.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded avatars, served by the API's static mount.
    location /uploads/ {
        proxy_pass http://api:8000/uploads/;
        proxy_set_header Host $host;
    }

    # SPA fallback: let react-router own every non-file route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
